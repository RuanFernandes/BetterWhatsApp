name: Desktop installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.x"
  NODE_VERSION: "20.x"
  WAILS_VERSION: "v3.0.0-alpha2.117"

jobs:
  build-installer:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes

          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $nsisRoot = @(
            (Join-Path $programFilesX86 "NSIS"),
            (Join-Path $env:ProgramFiles "NSIS")
          ) |
            Where-Object { Test-Path (Join-Path $_ "makensis.exe") } |
            Select-Object -First 1

          if ($null -eq $nsisRoot) {
            throw "O makensis.exe não foi encontrado após a instalação do NSIS."
          }

          $nsisRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$nsisRoot;$env:Path"
          & (Join-Path $nsisRoot "makensis.exe") /VERSION

      - name: Install Wails 3 CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          $goBin = Join-Path (go env GOPATH) "bin"
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $goBin "wails3.exe") version

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Prepare local WA-JS bundle
        run: npm run prepare:wa-js

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts -i -clean=true

      - name: Build Windows installer
        run: wails3 package GOOS=windows GOARCH=amd64 APP_VERSION=build-${{ github.run_number }}

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "bin", "build/windows/nsis" -Filter "*-installer.exe" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($null -eq $installer) {
            throw "Nenhum instalador NSIS foi encontrado."
          }

          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "Encontrado: $($installer.FullName)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterWhatsApp-windows-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  build-linux-installer:
    name: Build Debian installer
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            desktop-file-utils \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Wails 3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          wails_bin="$(go env GOPATH)/bin"
          echo "$wails_bin" >> "$GITHUB_PATH"
          export PATH="$wails_bin:$PATH"
          wails3 version

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Prepare local WA-JS bundle
        run: npm run prepare:wa-js

      - name: Generate Wails bindings
        run: wails3 generate bindings -ts -i -clean=true

      - name: Build Debian installer
        run: wails3 task linux:create:deb GOOS=linux GOARCH=amd64 APP_VERSION=build-${{ github.run_number }}

      - name: Locate installer
        id: installer
        run: |
          installer_path="$(find bin -maxdepth 1 -type f -name '*.deb' -print -quit)"

          if [ -z "$installer_path" ]; then
            echo "Nenhum pacote Debian foi encontrado em bin/." >&2
            exit 1
          fi

          echo "path=$installer_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$installer_path")" >> "$GITHUB_OUTPUT"
          echo "Encontrado: $installer_path"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterWhatsApp-linux-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish installers release
    needs:
      - build-installer
      - build-linux-installer
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: BetterWhatsApp-windows-installer
          path: dist/windows

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: BetterWhatsApp-linux-installer
          path: dist/linux

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
          RELEASE_TITLE: "BetterWhatsApp build #${{ github.run_number }}"
          RELEASE_NOTES: |
            Instaladores Windows e Ubuntu 24.04 LTS gerados automaticamente a partir do commit ${{ github.sha }}.
            Este build é uma prévia contínua da branch main.
        run: |
          gh release create "$RELEASE_TAG" \
            dist/windows/*.exe \
            dist/linux/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --prerelease
